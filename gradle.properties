# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Disabled as a precaution alongside ksp.incremental below - see that comment. Not required by
# itself, but there's no benefit to it while incremental KSP (the actual cause) is off.
org.gradle.configuration-cache=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# KSP's incremental change-tracking calls Path.relativize() between dependency jars (in the
# Gradle user home cache) and the project dir; on Windows this throws
# "this and base files have different roots" whenever those live on different drive letters
# (observed here: project on D:, caches on C:) - intermittently, since it depends on which
# jar entries get compared on a given build. Disabling incremental KSP avoids that code path
# entirely (kspDebugKotlin reprocesses fully each time - slower, but reliable). Re-enable if
# this project and the Gradle user home end up on the same drive, or once fixed upstream:
# https://github.com/google/ksp/issues/2729
ksp.incremental=false
# TEMPORARY: AGP 9's "built-in Kotlin" (mandatory - com.android.application registers it
# unconditionally, so it can't be opted out of via the classic kotlin-android plugin) rejects
# how the current KSP release (2.2.10-2.0.2) registers its generated source dirs. Remove this
# once a KSP release for our Kotlin version natively supports built-in Kotlin:
# https://github.com/google/ksp/issues/2729
android.disallowKotlinSourceSets=false